services:
  db:
    image: mysql:8.0
    container_name: tour-booking-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tour_booking
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tour-booking-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: run.py
      FLASK_DEBUG: "1"
      SECRET_KEY: dev-secret-key
      JWT_SECRET_KEY: dev-jwt-secret
      DATABASE_URL: mysql+pymysql://root:password@db:3306/tour_booking
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: password
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend-state:/var/lib/tour-booking

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tour-booking-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql-data:
  backend-state:
