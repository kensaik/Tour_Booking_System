name: CI

# Run on PRs targeting any branch and on pushes to main.
# Concurrency cancels superseded runs on the same ref to save minutes.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Backend: ruff lint + format check, then pytest.
  # Python version pinned to 3.11 to match `tool.ruff.target-version` in
  # backend/pyproject.toml.
  # -----------------------------------------------------------------------
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (with coverage gate)
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # -----------------------------------------------------------------------
  # Frontend: ESLint + Prettier check + TypeScript build check.
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend package.json
        id: detect
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not present yet — skipping frontend lint/test."
          fi
        working-directory: ${{ github.workspace }}

      - name: Set up Node.js 20
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: ESLint
        if: steps.detect.outputs.exists == 'true'
        run: npm run lint

      - name: Prettier check
        if: steps.detect.outputs.exists == 'true'
        run: npm run format:check

      - name: Vitest (unit)
        if: steps.detect.outputs.exists == 'true'
        run: npm run test:unit

      - name: TypeScript check
        if: steps.detect.outputs.exists == 'true'
        run: npx tsc --noEmit
