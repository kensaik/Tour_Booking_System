name: CI

# Run on PRs targeting any branch and on pushes to main.
# Concurrency cancels superseded runs on the same ref to save minutes.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Backend: ruff lint + format check, then pytest.
  # Python version pinned to 3.11 to match `tool.ruff.target-version` in
  # backend/pyproject.toml.
  # -----------------------------------------------------------------------
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -ra

  # -----------------------------------------------------------------------
  # Frontend: ESLint + Prettier check + (optional) test.
  # The Vite app is scaffolded by Phase 0.5; until `frontend/package.json`
  # exists this job is a no-op so CI stays green for backend-only PRs.
  # Once package.json lands, this job auto-activates.
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend package.json
        id: detect
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not present yet — skipping frontend lint/test."
          fi
        working-directory: ${{ github.workspace }}

      - name: Set up Node.js 20
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: ESLint
        if: steps.detect.outputs.exists == 'true'
        run: npm run lint

      - name: Prettier check
        if: steps.detect.outputs.exists == 'true'
        run: npm run format:check

      - name: Test
        # Only runs if a `test` script exists in package.json — Vite scaffold
        # does not include one by default, so we probe with `npm run` first.
        if: steps.detect.outputs.exists == 'true'
        run: |
          if npm run | grep -qE '^[[:space:]]+test$'; then
            npm test -- --run
          else
            echo "::notice::No 'test' script defined in package.json — skipping."
          fi
