name: CI

# Run on PRs targeting any branch and on pushes to main.
# Concurrency cancels superseded runs on the same ref to save minutes.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Backend: ruff lint + format check, then pytest.
  # Python version pinned to 3.11 to match `tool.ruff.target-version` in
  # backend/pyproject.toml.
  # -----------------------------------------------------------------------
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (with coverage gate)
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # -----------------------------------------------------------------------
  # Frontend unit: ESLint + Prettier + Vitest with 70% coverage gate.
  # -----------------------------------------------------------------------
  frontend-unit:
    name: Frontend (unit + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Vitest unit tests + coverage gate
        run: npm run test:unit:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/index.html

  # -----------------------------------------------------------------------
  # Frontend E2E: spin up MySQL + Flask + Vite preview, then run Playwright.
  # Real backend (no MSW) — per-spec page.route() handles edge cases.
  # -----------------------------------------------------------------------
  frontend-e2e:
    name: Frontend (e2e)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tour_booking_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      FLASK_ENV: test
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tour_booking_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Seed database (creates schema via db.create_all)
        run: python -m database.seed
        working-directory: backend

      - name: Start Flask backend
        run: nohup python run.py > flask.log 2>&1 &
        working-directory: backend

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Wait for Flask backend
        run: npx --yes wait-on http://localhost:5000/api/health -t 30000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Start Vite preview server
        run: nohup npm run preview -- --port 5173 --strictPort > vite.log 2>&1 &
        working-directory: frontend

      - name: Wait for Vite preview
        run: npx --yes wait-on http://localhost:5173 -t 30000

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Upload server logs (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            backend/flask.log
            frontend/vite.log
