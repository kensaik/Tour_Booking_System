# Backend tooling configuration.
# Runtime deps live in `requirements.txt`; dev/lint deps in `requirements-dev.txt`.
# This file is intentionally NOT a packaging manifest — Flask app is run via
# `flask --app src run`, not via `pip install .`.

[tool.ruff]
# Match Black's default line length and EditorConfig.
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "venv",
    ".venv",
    "migrations/versions",  # Alembic-generated, do not lint
    "build",
    "dist",
]

[tool.ruff.lint]
# Curated rule set: flake8 core (E/F/W), pyflakes, isort, bugbear, simplify,
# comprehensions, naming, and pyupgrade. Keep the set tight enough to pass
# on day one; the team can broaden it later.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults — common in Flask/SQLAlchemy
    "N818",  # exception name suffix — we use `XxxError` already, but allow legacy
]

[tool.ruff.lint.per-file-ignores]
# Tests: allow assert, fixtures with leading underscore, longer functions
"tests/**/*.py" = ["S101", "B011", "N802"]
# Migrations are autogenerated
"migrations/**/*.py" = ["E", "F", "I", "N"]
# __init__.py: re-exports
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
